name: security
description: Security module - storage, biometrics, threat detection, attestation, screen protection, clipboard, session management
publish_to: 'none'

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  common:
    path: ../common
  flutter:
    sdk: flutter
  flutter_riverpod:
  fpdart:
  flutter_secure_storage:
  local_auth:
  # Local threat detection (no telemetry)
  safe_device:
  # Play Integrity (Android) + App Attest (iOS)
  app_device_integrity:

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail:
  very_good_analysis:
