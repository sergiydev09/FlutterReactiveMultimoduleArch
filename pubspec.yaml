name: banking_app_workspace

environment:
  sdk: ^3.11.0

workspace:
  - apps/mobile_app
  - packages/core/common
  - packages/core/domain
  - packages/core/mock
  - packages/core/security
  - packages/core/ui
  - packages/features/accounts
  - packages/features/authentication
  - packages/features/cards
  - packages/features/globalposition
  - packages/features/main_shell
  - packages/features/notifications
  - packages/features/onboarding
  - packages/features/payments
  - packages/features/settings
  - packages/libs/otp
  - packages/libs/promotions
  - packages/libs/webview

dependencies:
  app_device_integrity: ^1.1.0
  bloc_concurrency: ^0.3.0
  crypto: ^3.0.6
  dio: ^5.8.0+1
  dio_cache_interceptor: ^4.0.5
  easy_localization: ^3.0.7+1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_inappwebview: ^6.1.5
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.0.0
  fpdart: ^1.1.0
  freezed_annotation: ^3.0.0
  go_router: ^17.1.0
  intl: any
  json_annotation: ^4.9.0
  local_auth: ^3.0.1
  retrofit: ^4.9.2
  riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  safe_device: ^1.2.0

dev_dependencies:
  bloc_test: any
  build_runner: any
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  freezed: any
  json_serializable: any
  melos: ^7.0.0
  mocktail: any
  retrofit_generator: ^10.2.3
  riverpod_generator: ^4.0.3
  riverpod_lint: ^3.1.3
  very_good_analysis: any

melos:
  scripts:
    test:
      description: Run all tests with coverage
      run: flutter test --coverage
      exec:
        concurrency: 1
        failFast: true

    test:changed:
      description: Run tests only for changed packages
      run: melos exec --since=origin/main -- "flutter test --coverage"

    build:runner:
      description: Run build_runner (freezed, json_serializable)
      run: dart run build_runner build --delete-conflicting-outputs
      exec:
        concurrency: 2
        orderDependents: true

    generate:
      description: Genera LocaleKeys + build_runner (freezed, json_serializable, retrofit)
      steps:
        - l10n:generate
        - build:runner

    l10n:generate:
      description: Genera LocaleKeys a partir de los JSONs de traducción
      run: >
        dart run easy_localization:generate
        -S assets/translations
        -O lib/generated
        -f keys
        -o locale_keys.g.dart
      exec:
        concurrency: 1
      packageFilters:
        scope:
          - common

    build:apk:
      description: Build release APK with obfuscation
      run: >
        flutter build apk
        --flavor prod
        -t lib/main_prod.dart
        --obfuscate
        --split-debug-info=build/symbols/
      exec:
        packageFilters:
          scope: mobile_app

    build:ios:
      description: Build release iOS with obfuscation
      run: >
        flutter build ios
        --flavor prod
        -t lib/main_prod.dart
        --obfuscate
        --split-debug-info=build/symbols/
      exec:
        packageFilters:
          scope: mobile_app

    icons:
      description: Generate launcher icons for all flavors
      run: dart run flutter_launcher_icons
      exec:
        packageFilters:
          scope: mobile_app

    clean:
      description: Clean all packages
      run: flutter clean
      exec:
        concurrency: 4
