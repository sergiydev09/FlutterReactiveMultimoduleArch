<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrevista Tecnica Flutter</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-light: #e8f0fe;
      --mid: #0d9488;
      --mid-light: #ccfbf1;
      --mid-border: #5eead4;
      --senior: #7c3aed;
      --senior-light: #ede9fe;
      --senior-border: #a78bfa;
      --success: #16a34a;
      --warning: #ea580c;
      --danger: #dc2626;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-500: #6b7280;
      --gray-700: #374151;
      --gray-900: #111827;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--gray-50);
      color: var(--gray-900);
      line-height: 1.6;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px;
    }

    /* Header */
    .header {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      padding: 32px;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 24px;
      color: var(--primary);
      margin-bottom: 24px;
    }

    .header-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .header-grid label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-500);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .header-grid input, .header-grid select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--gray-300);
      border-radius: var(--radius);
      font-size: 15px;
      transition: border-color 0.2s;
    }

    .header-grid input:focus, .header-grid select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    /* Level filter tabs */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      background: white;
      padding: 12px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--gray-200);
      align-items: center;
    }

    .filter-bar span {
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-500);
      margin-right: 8px;
    }

    .filter-btn {
      padding: 6px 16px;
      border: 1px solid var(--gray-300);
      border-radius: 20px;
      background: white;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover { background: var(--gray-100); }
    .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    /* Category section */
    .category {
      margin-bottom: 32px;
    }

    .category-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--gray-700);
      padding: 12px 0;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--gray-200);
    }

    .category-title .cat-icon { margin-right: 8px; }

    /* Question card */
    .question-card {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      margin-bottom: 16px;
      overflow: hidden;
      transition: box-shadow 0.2s;
    }

    .question-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

    .question-card.level-mid { border-left: 4px solid var(--mid); }
    .question-card.level-senior { border-left: 4px solid var(--senior); }

    .q-header {
      display: flex;
      align-items: flex-start;
      padding: 16px 20px;
      cursor: pointer;
      gap: 12px;
      user-select: none;
    }

    .q-number {
      font-size: 13px;
      font-weight: 700;
      color: white;
      min-width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .level-mid .q-number { background: var(--mid); }
    .level-senior .q-number { background: var(--senior); }

    .q-meta {
      flex: 1;
    }

    .q-badges {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .badge-mid { background: var(--mid-light); color: var(--mid); }
    .badge-senior { background: var(--senior-light); color: var(--senior); }

    .q-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--gray-900);
      line-height: 1.5;
    }

    .q-toggle {
      color: var(--gray-300);
      font-size: 20px;
      transition: transform 0.2s;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .question-card.open .q-toggle { transform: rotate(180deg); }

    /* Expandable body */
    .q-body {
      display: none;
      padding: 0 20px 20px 60px;
    }

    .question-card.open .q-body { display: block; }

    .answer-section {
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }

    .answer-section h4 {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--gray-500);
      margin-bottom: 8px;
    }

    .answer-section p, .answer-section ul {
      font-size: 14px;
      color: var(--gray-700);
      line-height: 1.7;
    }

    .answer-section ul {
      padding-left: 20px;
    }

    .answer-section li { margin-bottom: 4px; }

    .answer-section code {
      background: var(--primary-light);
      color: var(--primary);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 13px;
      font-family: 'SF Mono', Consolas, monospace;
    }

    .answer-section pre {
      background: var(--gray-900);
      color: #e5e7eb;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      overflow-x: auto;
      margin-top: 8px;
      font-family: 'SF Mono', Consolas, monospace;
      line-height: 1.5;
    }

    /* Evaluation */
    .eval-section {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px 16px;
      align-items: start;
    }

    .eval-section label {
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-500);
      padding-top: 8px;
    }

    .rating-group {
      display: flex;
      gap: 6px;
    }

    .rating-btn {
      width: 36px;
      height: 36px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius);
      background: white;
      font-size: 14px;
      font-weight: 700;
      color: var(--gray-500);
      cursor: pointer;
      transition: all 0.15s;
    }

    .rating-btn:hover { border-color: var(--primary); color: var(--primary); }
    .rating-btn.selected-1 { background: var(--danger); color: white; border-color: var(--danger); }
    .rating-btn.selected-2 { background: var(--warning); color: white; border-color: var(--warning); }
    .rating-btn.selected-3 { background: #eab308; color: white; border-color: #eab308; }
    .rating-btn.selected-4 { background: var(--success); color: white; border-color: var(--success); }
    .rating-btn.selected-5 { background: var(--primary); color: white; border-color: var(--primary); }

    .rating-label {
      font-size: 11px;
      color: var(--gray-500);
      display: flex;
      justify-content: space-between;
      padding: 0 2px;
      margin-top: 2px;
    }

    .notes-input {
      width: 100%;
      min-height: 60px;
      padding: 10px 12px;
      border: 1px solid var(--gray-300);
      border-radius: var(--radius);
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      transition: border-color 0.2s;
    }

    .notes-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    /* Summary footer */
    .summary {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      padding: 24px 32px;
      margin-top: 32px;
    }

    .summary h2 {
      font-size: 18px;
      color: var(--gray-700);
      margin-bottom: 16px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .summary-card {
      text-align: center;
      padding: 16px;
      border-radius: var(--radius);
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
    }

    .summary-card .score {
      font-size: 32px;
      font-weight: 800;
      color: var(--primary);
    }

    .summary-card .label {
      font-size: 12px;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .general-notes {
      width: 100%;
      min-height: 100px;
      padding: 12px 16px;
      border: 1px solid var(--gray-300);
      border-radius: var(--radius);
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      margin-top: 8px;
    }

    .general-notes:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    /* Actions */
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      justify-content: flex-end;
    }

    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: #1557b0; }
    .btn-outline { background: white; color: var(--gray-700); border: 1px solid var(--gray-300); }
    .btn-outline:hover { background: var(--gray-100); }
    .btn-danger { background: white; color: var(--danger); border: 1px solid var(--gray-300); }
    .btn-danger:hover { background: #fef2f2; border-color: var(--danger); }

    /* Print */
    @media print {
      body { background: white; }
      .container { max-width: 100%; padding: 0; }
      .filter-bar, .actions, .btn { display: none !important; }
      .question-card.open .q-body { display: block !important; }
      .question-card { break-inside: avoid; page-break-inside: avoid; }
      .q-toggle { display: none; }
    }

    /* Responsive */
    @media (max-width: 640px) {
      .header-grid { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: 1fr 1fr; }
      .eval-section { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>Entrevista Tecnica &mdash; Flutter Developer</h1>
      <div class="header-grid">
        <div>
          <label>Nome do candidato</label>
          <input type="text" id="candidateName" placeholder="Nome completo">
        </div>
        <div>
          <label>Cargo avaliado</label>
          <select id="positionLevel">
            <option value="mid">Desenvolvedor Pleno</option>
            <option value="senior">Desenvolvedor Senior</option>
          </select>
        </div>
        <div>
          <label>Data</label>
          <input type="date" id="interviewDate">
        </div>
        <div>
          <label>Entrevistador</label>
          <input type="text" id="interviewerName" placeholder="Seu nome">
        </div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filter-bar">
      <span>Filtrar:</span>
      <button class="filter-btn active" onclick="filterQuestions('all')">Todas</button>
      <button class="filter-btn" onclick="filterQuestions('mid')">Pleno</button>
      <button class="filter-btn" onclick="filterQuestions('senior')">Senior</button>
    </div>

    <!-- Questions container -->
    <div id="questionsContainer"></div>

    <!-- Summary -->
    <div class="summary">
      <h2>Resumo da Avaliacao</h2>
      <div class="summary-grid">
        <div class="summary-card">
          <div class="score" id="avgScore">-</div>
          <div class="label">Media geral</div>
        </div>
        <div class="summary-card">
          <div class="score" id="avgMid">-</div>
          <div class="label">Media Pleno</div>
        </div>
        <div class="summary-card">
          <div class="score" id="avgSenior">-</div>
          <div class="label">Media Senior</div>
        </div>
        <div class="summary-card">
          <div class="score" id="answeredCount">0</div>
          <div class="label">Perguntas avaliadas</div>
        </div>
      </div>
      <label style="font-size:13px; font-weight:600; color:var(--gray-500); text-transform:uppercase; letter-spacing:0.5px;">
        Notas gerais / Decisao final
      </label>
      <textarea class="general-notes" id="generalNotes" placeholder="Impressoes gerais, pontos fortes, areas de melhoria, decisao..."></textarea>
      <div class="actions">
        <button class="btn btn-danger" onclick="resetAll()">Limpar tudo</button>
        <button class="btn btn-outline" onclick="expandAll()">Expandir todas</button>
        <button class="btn btn-outline" onclick="collapseAll()">Recolher todas</button>
        <button class="btn btn-outline" onclick="exportJSON()">Exportar JSON</button>
        <button class="btn btn-primary" onclick="window.print()">Imprimir / PDF</button>
      </div>
    </div>
  </div>

<script>
// ──────────────────────────────────────────
//  DATA: Questions bank
// ──────────────────────────────────────────
const questions = [
  // ── DART & FLUTTER CORE ──
  {
    cat: "Dart & Flutter Core",
    catIcon: "01",
    level: "mid",
    q: "Explique a diferenca entre StatelessWidget e StatefulWidget. Quando voce usaria cada um?",
    a: `<p><code>StatelessWidget</code> nao possui estado interno mutavel; seu <code>build()</code> depende apenas da configuracao recebida pelo construtor. <code>StatefulWidget</code> esta associado a um <code>State</code> que persiste entre rebuilds e pode ser alterado com <code>setState()</code>.</p>
<ul>
  <li><b>Stateless:</b> widgets puramente apresentacionais (icones, labels, layouts fixos).</li>
  <li><b>Stateful:</b> quando e necessario estado local: animacoes, controladores de texto, formularios.</li>
</ul>
<p>Se voce usa BLoC para o estado de negocio, a maioria das Pages sao <code>StatefulWidget</code> apenas quando precisam do <code>dispose</code> de controladores; a logica de estado fica no Bloc.</p>`
  },
  {
    cat: "Dart & Flutter Core",
    level: "mid",
    q: "O que sao os BuildContext e como funciona a arvore de widgets?",
    a: `<p><code>BuildContext</code> e um handle para o no do widget na Element Tree. Cada widget cria um <code>Element</code>; o contexto permite navegar pela arvore para cima (<code>context.findAncestorWidgetOfExactType</code>, <code>context.read</code>, etc.).</p>
<ul>
  <li>Flutter mantem tres arvores: Widget Tree, Element Tree e RenderObject Tree.</li>
  <li>Os widgets sao configuracoes imutaveis; os Elements sao a instancia viva que compara old vs new widget.</li>
  <li>Usar o contexto incorreto (por exemplo, antes de um Provider estar na arvore) causa erros de <code>ProviderNotFoundException</code>.</li>
</ul>`
  },
  {
    cat: "Dart & Flutter Core",
    level: "mid",
    q: "Qual a diferenca entre const e final em Dart? Quando voce usa cada um?",
    a: `<p><code>final</code> e atribuido uma unica vez, em runtime. <code>const</code> e uma constante de compilacao &mdash; o valor deve ser conhecido em tempo de compilacao.</p>
<ul>
  <li><code>const</code> em widgets permite ao framework reutilizar a mesma instancia (canonicalizacao), melhorando a performance.</li>
  <li><code>final</code> e usado para valores calculados em runtime que nao mudam depois (parametros de construtor, resultado de uma funcao).</li>
</ul>
<pre>const maxRetries = 3;          // compile-time
final now = DateTime.now();     // runtime, imutavel</pre>`
  },
  {
    cat: "Dart & Flutter Core",
    level: "mid",
    q: "Como funciona o ciclo de vida de um StatefulWidget? Cite os metodos principais.",
    a: `<ul>
  <li><code>createState()</code> &mdash; cria o objeto State.</li>
  <li><code>initState()</code> &mdash; chamado uma vez ao inserir o widget. Ideal para subscricoes ou inicializacao.</li>
  <li><code>didChangeDependencies()</code> &mdash; chamado apos initState e quando InheritedWidgets mudam.</li>
  <li><code>build()</code> &mdash; constroi a sub-arvore. Chamado toda vez que o estado muda.</li>
  <li><code>didUpdateWidget()</code> &mdash; quando o pai reconstroi e passa uma nova configuracao.</li>
  <li><code>deactivate()</code> &mdash; o widget e removido da arvore (pode ser reinserido).</li>
  <li><code>dispose()</code> &mdash; limpeza definitiva (cancelar subscricoes, controllers).</li>
</ul>`
  },
  {
    cat: "Dart & Flutter Core",
    level: "senior",
    q: "Explique como funciona o rendering pipeline do Flutter (do widget aos pixels). Qual o papel das tres arvores?",
    a: `<p>Flutter mantem tres arvores:</p>
<ol>
  <li><b>Widget Tree:</b> configuracoes imutaveis declaradas no <code>build()</code>.</li>
  <li><b>Element Tree:</b> instancias vivas que comparam old/new widget (<code>canUpdate</code> por <code>runtimeType</code> + <code>key</code>). Gerenciam o ciclo de vida.</li>
  <li><b>RenderObject Tree:</b> responsavel pelo layout (<code>performLayout</code>), painting (<code>paint</code>) e hit testing.</li>
</ol>
<p>Pipeline: <code>build phase</code> &rarr; <code>layout phase</code> (constraints down, sizes up) &rarr; <code>paint phase</code> (Layer tree) &rarr; <code>compositing</code> (Skia/Impeller) &rarr; <code>rasterization</code> na GPU.</p>
<p>Entender isso e fundamental para diagnosticar jank: se o build e custoso, utiliza-se <code>const</code> widgets ou limita-se os rebuilds com <code>BlocSelector</code>/<code>BlocBuilder</code> com <code>buildWhen</code>.</p>`
  },
  {
    cat: "Dart & Flutter Core",
    level: "senior",
    q: "O que e Impeller e como se diferencia do Skia? Qual o impacto na performance?",
    a: `<p><b>Skia</b> era o backend de renderizacao original; compilava shaders em runtime, causando &laquo;shader compilation jank&raquo; na primeira execucao de animacoes.</p>
<p><b>Impeller</b> (default no iOS desde Flutter 3.16, Android desde 3.22) pre-compila todos os shaders em build time. Vantagens:</p>
<ul>
  <li>Eliminacao total do shader jank.</li>
  <li>Melhor uso de APIs graficas modernas (Metal no iOS, Vulkan no Android).</li>
  <li>Performance mais previsivel e consistent frame times.</li>
</ul>`
  },
  {
    cat: "Dart & Flutter Core",
    level: "senior",
    q: "Dart e single-threaded. Quando voce usa async/await e quando um Isolate? De exemplos de um app bancario.",
    a: `<p>Dart possui uma unica thread com um <b>event loop</b>. Ha duas formas de executar trabalho sem bloquear a UI:</p>

<table style="width:100%; border-collapse:collapse; font-size:13px; margin:12px 0;">
  <tr style="background:#f3f4f6;">
    <th style="padding:8px; text-align:left; border:1px solid #e5e7eb;">Mecanismo</th>
    <th style="padding:8px; text-align:left; border:1px solid #e5e7eb;">Quando usar</th>
    <th style="padding:8px; text-align:left; border:1px solid #e5e7eb;">Exemplo em app bancario</th>
  </tr>
  <tr>
    <td style="padding:8px; border:1px solid #e5e7eb;"><code>Future</code> / async-await</td>
    <td style="padding:8px; border:1px solid #e5e7eb;">Operacoes de <b>I/O</b> (HTTP, DB, arquivos). A thread fica livre enquanto aguarda a resposta externa.</td>
    <td style="padding:8px; border:1px solid #e5e7eb;">Chamadas de API (login, contas, transferencias), leitura/escrita no SecureStorage, queries no SQLite.</td>
  </tr>
  <tr style="background:#f9fafb;">
    <td style="padding:8px; border:1px solid #e5e7eb;"><code>Isolate.run()</code></td>
    <td style="padding:8px; border:1px solid #e5e7eb;">Trabalho <b>intensivo de CPU</b> que bloqueia a thread (&gt;16ms). Roda em uma thread separada com memoria isolada.</td>
    <td style="padding:8px; border:1px solid #e5e7eb;">Parsear JSON de 10k transacoes, criptografia/descriptografia AES, gerar PDF de extrato bancario.</td>
  </tr>
</table>

<p><b>Regra pratica:</b> se o trabalho e <b>esperar</b> (rede, disco) &rarr; <code>async/await</code>. Se o trabalho e <b>calcular</b> (CPU) &rarr; <code>Isolate</code>.</p>

<pre>// ESPERAR resposta da rede - async/await
final accounts = await accountsRepository.getAll();
// A thread fica livre, a UI continua respondendo

// CALCULAR algo pesado - Isolate
final parsed = await Isolate.run(() {
  return jsonDecode(hugeJsonString) as List; // CPU-bound
});
// Sem Isolate, a UI congela durante o parsing</pre>

<p><b>Erro comum:</b> usar <code>async/await</code> para trabalho CPU-bound achando que nao bloqueia. <code>await</code> so libera a thread enquanto aguarda I/O; se a funcao faz calculo puro, a thread bloqueia do mesmo jeito e a UI perde frames.</p>`
  },

  // ── CLEAN ARCHITECTURE ──
  {
    cat: "Clean Architecture",
    catIcon: "02",
    level: "mid",
    q: "O que e Clean Architecture e quais sao suas camadas? Como voce aplicaria em um projeto Flutter?",
    a: `<p>Clean Architecture separa o codigo em camadas concentricas com a regra de dependencia: as camadas internas nao conhecem as externas.</p>
<p>Em Flutter, cada feature costuma ter 3 camadas:</p>
<ul>
  <li><b>Presentation:</b> Pages, BLoCs, widgets. Depende de domain.</li>
  <li><b>Domain:</b> Entities, contratos de Repository (abstratos), UseCases. Camada pura, sem dependencias externas.</li>
  <li><b>Data:</b> Models (DTOs), DataSources (abstratos), implementacoes de Repository. Depende de domain.</li>
</ul>
<pre>presentation/ &rarr; domain/ &larr; data/</pre>
<p>Domain e o centro: presentation e data dependem de domain, NUNCA o contrario.</p>`
  },

//  RENDER
// ──────────────────────────────────────────
let activeFilter = 'all';

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';

  const grouped = {};
  let globalIdx = 0;
  questions.forEach((q, i) => {
    q._idx = i;
    q._num = ++globalIdx;
    if (!grouped[q.cat]) grouped[q.cat] = { icon: q.catIcon || '', items: [] };
    grouped[q.cat].items.push(q);
  });

  for (const [cat, data] of Object.entries(grouped)) {
    const filtered = data.items.filter(q => activeFilter === 'all' || q.level === activeFilter);
    if (filtered.length === 0) continue;

    const section = document.createElement('div');
    section.className = 'category';
    section.innerHTML = `<div class="category-title"><span class="cat-icon">${data.icon}</span>${cat}</div>`;

    filtered.forEach(q => {
      const card = document.createElement('div');
      card.className = `question-card level-${q.level}`;
      card.id = `q-${q._idx}`;
      card.innerHTML = `
        <div class="q-header" onclick="toggleCard(${q._idx})">
          <div class="q-number">${q._num}</div>
          <div class="q-meta">
            <div class="q-badges">
              <span class="badge badge-${q.level}">${q.level}</span>
            </div>
            <div class="q-text">${q.q}</div>
          </div>
          <div class="q-toggle">&#9662;</div>
        </div>
        <div class="q-body">
          <div class="answer-section">
            <h4>Resposta esperada</h4>
            ${q.a}
          </div>
          <div class="eval-section">
            <label>Pontuacao</label>
            <div>
              <div class="rating-group">
                ${[1,2,3,4,5].map(n => `<button class="rating-btn" onclick="rate(${q._idx}, ${n})" id="rate-${q._idx}-${n}">${n}</button>`).join('')}
              </div>
              <div class="rating-label"><span>Insuficiente</span><span>Excelente</span></div>
            </div>
            <label>Notas</label>
            <textarea class="notes-input" id="notes-${q._idx}" placeholder="Anotacoes sobre a resposta do candidato..." oninput="saveNotes(${q._idx})"></textarea>
          </div>
        </div>
      `;
      section.appendChild(card);
    });

    container.appendChild(section);
  }

  // Restore saved data
  restoreData();
}

// ──────────────────────────────────────────
//  INTERACTIONS
// ──────────────────────────────────────────
const ratings = {};
const notes = {};

function toggleCard(idx) {
  const card = document.getElementById(`q-${idx}`);
  card.classList.toggle('open');
}

function rate(idx, value) {
  ratings[idx] = value;
  for (let i = 1; i <= 5; i++) {
    const btn = document.getElementById(`rate-${idx}-${i}`);
    btn.className = 'rating-btn' + (i === value ? ` selected-${i}` : '');
  }
  updateSummary();
  saveToStorage();
}

function saveNotes(idx) {
  const el = document.getElementById(`notes-${idx}`);
  if (el) {
    notes[idx] = el.value;
    saveToStorage();
  }
}

function filterQuestions(level) {
  activeFilter = level;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.trim().toLowerCase() === level || (level === 'all' && btn.textContent.trim() === 'Todas'));
  });
  renderQuestions();
}

function expandAll() {
  document.querySelectorAll('.question-card').forEach(c => c.classList.add('open'));
}

function collapseAll() {
  document.querySelectorAll('.question-card').forEach(c => c.classList.remove('open'));
}

function updateSummary() {
  const allRatings = Object.entries(ratings);
  const midRatings = allRatings.filter(([idx]) => questions[idx].level === 'mid');
  const seniorRatings = allRatings.filter(([idx]) => questions[idx].level === 'senior');

  const avg = arr => arr.length ? (arr.reduce((s, [,v]) => s + v, 0) / arr.length).toFixed(1) : '-';

  document.getElementById('avgScore').textContent = avg(allRatings);
  document.getElementById('avgMid').textContent = avg(midRatings);
  document.getElementById('avgSenior').textContent = avg(seniorRatings);
  document.getElementById('answeredCount').textContent = allRatings.length + '/' + questions.length;
}

// ──────────────────────────────────────────
//  PERSISTENCE (localStorage)
// ──────────────────────────────────────────
function saveToStorage() {
  const data = {
    candidate: document.getElementById('candidateName').value,
    position: document.getElementById('positionLevel').value,
    date: document.getElementById('interviewDate').value,
    interviewer: document.getElementById('interviewerName').value,
    ratings,
    notes,
    generalNotes: document.getElementById('generalNotes').value,
  };
  localStorage.setItem('flutter_interview_pt', JSON.stringify(data));
}

function restoreData() {
  const raw = localStorage.getItem('flutter_interview_pt');
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    document.getElementById('candidateName').value = data.candidate || '';
    document.getElementById('positionLevel').value = data.position || 'mid';
    document.getElementById('interviewDate').value = data.date || '';
    document.getElementById('interviewerName').value = data.interviewer || '';
    document.getElementById('generalNotes').value = data.generalNotes || '';

    if (data.ratings) {
      Object.entries(data.ratings).forEach(([idx, val]) => {
        ratings[idx] = val;
        for (let i = 1; i <= 5; i++) {
          const btn = document.getElementById(`rate-${idx}-${i}`);
          if (btn) btn.className = 'rating-btn' + (i === val ? ` selected-${i}` : '');
        }
      });
    }
    if (data.notes) {
      Object.entries(data.notes).forEach(([idx, val]) => {
        notes[idx] = val;
        const el = document.getElementById(`notes-${idx}`);
        if (el) el.value = val;
      });
    }
    updateSummary();
  } catch(e) {}
}

function resetAll() {
  if (!confirm('Tem certeza de que deseja limpar toda a avaliacao?')) return;
  localStorage.removeItem('flutter_interview_pt');
  Object.keys(ratings).forEach(k => delete ratings[k]);
  Object.keys(notes).forEach(k => delete notes[k]);
  document.getElementById('candidateName').value = '';
  document.getElementById('positionLevel').value = 'mid';
  document.getElementById('interviewDate').value = '';
  document.getElementById('interviewerName').value = '';
  document.getElementById('generalNotes').value = '';
  renderQuestions();
}

function exportJSON() {
  const data = {
    candidate: document.getElementById('candidateName').value,
    position: document.getElementById('positionLevel').value,
    date: document.getElementById('interviewDate').value,
    interviewer: document.getElementById('interviewerName').value,
    generalNotes: document.getElementById('generalNotes').value,
    questions: questions.map((q, i) => ({
      number: q._num,
      category: q.cat,
      level: q.level,
      question: q.q,
      rating: ratings[i] || null,
      notes: notes[i] || '',
    })),
    summary: {
      average: document.getElementById('avgScore').textContent,
      averageMid: document.getElementById('avgMid').textContent,
      averageSenior: document.getElementById('avgSenior').textContent,
      answeredCount: Object.keys(ratings).length,
      totalQuestions: questions.length,
    }
  };

  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `entrevista_${data.candidate.replace(/\s+/g, '_') || 'candidato'}_${data.date || 'sem_data'}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// Auto-save header fields
['candidateName', 'positionLevel', 'interviewDate', 'interviewerName', 'generalNotes'].forEach(id => {
  document.getElementById(id).addEventListener('input', saveToStorage);
  document.getElementById(id).addEventListener('change', saveToStorage);
});

// Set today's date
document.getElementById('interviewDate').value = new Date().toISOString().split('T')[0];

// Initial render
renderQuestions();
</script>
</body>
</html>
