<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flutter Technical Interview</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-light: #e8f0fe;
      --mid: #0d9488;
      --mid-light: #ccfbf1;
      --mid-border: #5eead4;
      --senior: #7c3aed;
      --senior-light: #ede9fe;
      --senior-border: #a78bfa;
      --success: #16a34a;
      --warning: #ea580c;
      --danger: #dc2626;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-500: #6b7280;
      --gray-700: #374151;
      --gray-900: #111827;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--gray-50);
      color: var(--gray-900);
      line-height: 1.6;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px;
    }

    /* Header */
    .header {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      padding: 32px;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 24px;
      color: var(--primary);
      margin-bottom: 24px;
    }

    .header-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .header-grid label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-500);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .header-grid input, .header-grid select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--gray-300);
      border-radius: var(--radius);
      font-size: 15px;
      transition: border-color 0.2s;
    }

    .header-grid input:focus, .header-grid select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    /* Level filter tabs */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      background: white;
      padding: 12px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--gray-200);
      align-items: center;
    }

    .filter-bar span {
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-500);
      margin-right: 8px;
    }

    .filter-btn {
      padding: 6px 16px;
      border: 1px solid var(--gray-300);
      border-radius: 20px;
      background: white;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover { background: var(--gray-100); }
    .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    /* Category section */
    .category {
      margin-bottom: 32px;
    }

    .category-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--gray-700);
      padding: 12px 0;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--gray-200);
    }

    .category-title .cat-icon { margin-right: 8px; }

    /* Question card */
    .question-card {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      margin-bottom: 16px;
      overflow: hidden;
      transition: box-shadow 0.2s;
    }

    .question-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

    .question-card.level-mid { border-left: 4px solid var(--mid); }
    .question-card.level-senior { border-left: 4px solid var(--senior); }

    .q-header {
      display: flex;
      align-items: flex-start;
      padding: 16px 20px;
      cursor: pointer;
      gap: 12px;
      user-select: none;
    }

    .q-number {
      font-size: 13px;
      font-weight: 700;
      color: white;
      min-width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .level-mid .q-number { background: var(--mid); }
    .level-senior .q-number { background: var(--senior); }

    .q-meta {
      flex: 1;
    }

    .q-badges {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .badge-mid { background: var(--mid-light); color: var(--mid); }
    .badge-senior { background: var(--senior-light); color: var(--senior); }

    .q-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--gray-900);
      line-height: 1.5;
    }

    .q-toggle {
      color: var(--gray-300);
      font-size: 20px;
      transition: transform 0.2s;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .question-card.open .q-toggle { transform: rotate(180deg); }

    /* Expandable body */
    .q-body {
      display: none;
      padding: 0 20px 20px 60px;
    }

    .question-card.open .q-body { display: block; }

    .answer-section {
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }

    .answer-section h4 {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--gray-500);
      margin-bottom: 8px;
    }

    .answer-section p, .answer-section ul {
      font-size: 14px;
      color: var(--gray-700);
      line-height: 1.7;
    }

    .answer-section ul {
      padding-left: 20px;
    }

    .answer-section li { margin-bottom: 4px; }

    .answer-section code {
      background: var(--primary-light);
      color: var(--primary);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 13px;
      font-family: 'SF Mono', Consolas, monospace;
    }

    .answer-section pre {
      background: var(--gray-900);
      color: #e5e7eb;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      overflow-x: auto;
      margin-top: 8px;
      font-family: 'SF Mono', Consolas, monospace;
      line-height: 1.5;
    }

    /* Evaluation */
    .eval-section {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px 16px;
      align-items: start;
    }

    .eval-section label {
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-500);
      padding-top: 8px;
    }

    .rating-group {
      display: flex;
      gap: 6px;
    }

    .rating-btn {
      width: 36px;
      height: 36px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius);
      background: white;
      font-size: 14px;
      font-weight: 700;
      color: var(--gray-500);
      cursor: pointer;
      transition: all 0.15s;
    }

    .rating-btn:hover { border-color: var(--primary); color: var(--primary); }
    .rating-btn.selected-1 { background: var(--danger); color: white; border-color: var(--danger); }
    .rating-btn.selected-2 { background: var(--warning); color: white; border-color: var(--warning); }
    .rating-btn.selected-3 { background: #eab308; color: white; border-color: #eab308; }
    .rating-btn.selected-4 { background: var(--success); color: white; border-color: var(--success); }
    .rating-btn.selected-5 { background: var(--primary); color: white; border-color: var(--primary); }

    .rating-label {
      font-size: 11px;
      color: var(--gray-500);
      display: flex;
      justify-content: space-between;
      padding: 0 2px;
      margin-top: 2px;
    }

    .notes-input {
      width: 100%;
      min-height: 60px;
      padding: 10px 12px;
      border: 1px solid var(--gray-300);
      border-radius: var(--radius);
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      transition: border-color 0.2s;
    }

    .notes-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    /* Summary footer */
    .summary {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      padding: 24px 32px;
      margin-top: 32px;
    }

    .summary h2 {
      font-size: 18px;
      color: var(--gray-700);
      margin-bottom: 16px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .summary-card {
      text-align: center;
      padding: 16px;
      border-radius: var(--radius);
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
    }

    .summary-card .score {
      font-size: 32px;
      font-weight: 800;
      color: var(--primary);
    }

    .summary-card .label {
      font-size: 12px;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .general-notes {
      width: 100%;
      min-height: 100px;
      padding: 12px 16px;
      border: 1px solid var(--gray-300);
      border-radius: var(--radius);
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      margin-top: 8px;
    }

    .general-notes:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    /* Actions */
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      justify-content: flex-end;
    }

    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: #1557b0; }
    .btn-outline { background: white; color: var(--gray-700); border: 1px solid var(--gray-300); }
    .btn-outline:hover { background: var(--gray-100); }
    .btn-danger { background: white; color: var(--danger); border: 1px solid var(--gray-300); }
    .btn-danger:hover { background: #fef2f2; border-color: var(--danger); }

    /* Print */
    @media print {
      body { background: white; }
      .container { max-width: 100%; padding: 0; }
      .filter-bar, .actions, .btn { display: none !important; }
      .question-card.open .q-body { display: block !important; }
      .question-card { break-inside: avoid; page-break-inside: avoid; }
      .q-toggle { display: none; }
    }

    /* Responsive */
    @media (max-width: 640px) {
      .header-grid { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: 1fr 1fr; }
      .eval-section { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>Technical Interview &mdash; Flutter Developer</h1>
      <div class="header-grid">
        <div>
          <label>Candidate name</label>
          <input type="text" id="candidateName" placeholder="Full name">
        </div>
        <div>
          <label>Position evaluated</label>
          <select id="positionLevel">
            <option value="mid">Mid Developer</option>
            <option value="senior">Senior Developer</option>
          </select>
        </div>
        <div>
          <label>Date</label>
          <input type="date" id="interviewDate">
        </div>
        <div>
          <label>Interviewer</label>
          <input type="text" id="interviewerName" placeholder="Your name">
        </div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filter-bar">
      <span>Filter:</span>
      <button class="filter-btn active" onclick="filterQuestions('all')">All</button>
      <button class="filter-btn" onclick="filterQuestions('mid')">Mid</button>
      <button class="filter-btn" onclick="filterQuestions('senior')">Senior</button>
    </div>

    <!-- Questions container -->
    <div id="questionsContainer"></div>

    <!-- Summary -->
    <div class="summary">
      <h2>Evaluation Summary</h2>
      <div class="summary-grid">
        <div class="summary-card">
          <div class="score" id="avgScore">-</div>
          <div class="label">Overall average</div>
        </div>
        <div class="summary-card">
          <div class="score" id="avgMid">-</div>
          <div class="label">Mid average</div>
        </div>
        <div class="summary-card">
          <div class="score" id="avgSenior">-</div>
          <div class="label">Senior average</div>
        </div>
        <div class="summary-card">
          <div class="score" id="answeredCount">0</div>
          <div class="label">Questions evaluated</div>
        </div>
      </div>
      <label style="font-size:13px; font-weight:600; color:var(--gray-500); text-transform:uppercase; letter-spacing:0.5px;">
        General notes / Final decision
      </label>
      <textarea class="general-notes" id="generalNotes" placeholder="General impressions, strengths, areas for improvement, decision..."></textarea>
      <div class="actions">
        <button class="btn btn-danger" onclick="resetAll()">Clear all</button>
        <button class="btn btn-outline" onclick="expandAll()">Expand all</button>
        <button class="btn btn-outline" onclick="collapseAll()">Collapse all</button>
        <button class="btn btn-outline" onclick="exportJSON()">Export JSON</button>
        <button class="btn btn-primary" onclick="window.print()">Print / PDF</button>
      </div>
    </div>
  </div>

<script>
// ──────────────────────────────────────────
//  DATA: Questions bank
// ──────────────────────────────────────────
const questions = [
  // ── DART & FLUTTER CORE ──
  {
    cat: "Dart & Flutter Core",
    catIcon: "01",
    level: "mid",
    q: "Explain the difference between StatelessWidget and StatefulWidget. When would you use each one?",
    a: `<p><code>StatelessWidget</code> has no mutable internal state; its <code>build()</code> depends only on the configuration received via constructor. <code>StatefulWidget</code> is associated with a <code>State</code> object that persists across rebuilds and can mutate via <code>setState()</code>.</p>
<ul>
  <li><b>Stateless:</b> purely presentational widgets (icons, labels, fixed layouts).</li>
  <li><b>Stateful:</b> when local state is needed: animations, text controllers, forms.</li>
</ul>
<p>If you use BLoC for business state, most Pages are <code>StatefulWidget</code> only when they need to <code>dispose</code> controllers; the state logic lives in the Bloc.</p>`
  },
  {
    cat: "Dart & Flutter Core",
    level: "mid",
    q: "What is BuildContext and how does the widget tree work?",
    a: `<p><code>BuildContext</code> is a handle to the widget's node in the Element Tree. Each widget creates an <code>Element</code>; the context allows navigating the tree upward (<code>context.findAncestorWidgetOfExactType</code>, <code>context.read</code>, etc.).</p>
<ul>
  <li>Flutter maintains three trees: Widget Tree, Element Tree, and RenderObject Tree.</li>
  <li>Widgets are immutable configurations; Elements are live instances that compare old vs new widget.</li>
  <li>Using the wrong context (for example, before a Provider is in the tree) causes <code>ProviderNotFoundException</code> errors.</li>
</ul>`
  },
  {
    cat: "Dart & Flutter Core",
    level: "mid",
    q: "What is the difference between const and final in Dart? When do you use each one?",
    a: `<p><code>final</code> is assigned once, at runtime. <code>const</code> is a compile-time constant &mdash; the value must be known at compile time.</p>
<ul>
  <li><code>const</code> in widgets allows the framework to reuse the same instance (canonicalization), improving performance.</li>
  <li><code>final</code> is used for values computed at runtime that don't change afterwards (constructor parameters, function results).</li>
</ul>
<pre>const maxRetries = 3;          // compile-time
final now = DateTime.now();     // runtime, immutable</pre>`
  },
  {
    cat: "Dart & Flutter Core",
    level: "mid",
    q: "How does the lifecycle of a StatefulWidget work? Name the main methods.",
    a: `<ul>
  <li><code>createState()</code> &mdash; creates the State object.</li>
  <li><code>initState()</code> &mdash; called once when the widget is inserted. Ideal for subscriptions or initialization.</li>
  <li><code>didChangeDependencies()</code> &mdash; called after initState and when InheritedWidgets change.</li>
  <li><code>build()</code> &mdash; builds the sub-tree. Called every time the state changes.</li>
  <li><code>didUpdateWidget()</code> &mdash; when the parent rebuilds and passes a new configuration.</li>
  <li><code>deactivate()</code> &mdash; the widget is removed from the tree (can be reinserted).</li>
  <li><code>dispose()</code> &mdash; definitive cleanup (cancel subscriptions, controllers).</li>
</ul>`
  },
  {
    cat: "Dart & Flutter Core",
    level: "senior",
    q: "Explain how Flutter's rendering pipeline works (from widget to pixels). What role do the three trees play?",
    a: `<p>Flutter maintains three trees:</p>
<ol>
  <li><b>Widget Tree:</b> immutable configurations declared in <code>build()</code>.</li>
  <li><b>Element Tree:</b> live instances that compare old/new widget (<code>canUpdate</code> by <code>runtimeType</code> + <code>key</code>). They manage the lifecycle.</li>
  <li><b>RenderObject Tree:</b> handles layout (<code>performLayout</code>), painting (<code>paint</code>), and hit testing.</li>
</ol>
<p>Pipeline: <code>build phase</code> &rarr; <code>layout phase</code> (constraints down, sizes up) &rarr; <code>paint phase</code> (Layer tree) &rarr; <code>compositing</code> (Skia/Impeller) &rarr; <code>rasterization</code> on GPU.</p>
<p>Understanding this is key to diagnosing jank: if the build is expensive, use <code>const</code> widgets or narrow down rebuilds with <code>BlocSelector</code>/<code>BlocBuilder</code> with <code>buildWhen</code>.</p>`
  },
  {
    cat: "Dart & Flutter Core",
    level: "senior",
    q: "What is Impeller and how does it differ from Skia? What impact does it have on performance?",
    a: `<p><b>Skia</b> was the original rendering backend; it compiled shaders at runtime, causing &laquo;shader compilation jank&raquo; on the first run of animations.</p>
<p><b>Impeller</b> (default on iOS since Flutter 3.16, Android since 3.22) precompiles all shaders at build time. Advantages:</p>
<ul>
  <li>Total elimination of shader jank.</li>
  <li>Better use of modern graphics APIs (Metal on iOS, Vulkan on Android).</li>
  <li>More predictable performance and consistent frame times.</li>
</ul>`
  },
  {
    cat: "Dart & Flutter Core",
    level: "senior",
    q: "Dart is single-threaded. When do you use async/await and when an Isolate? Give examples from a banking app.",
    a: `<p>Dart has a single thread with an <b>event loop</b>. There are two ways to execute work without blocking the UI:</p>

<table style="width:100%; border-collapse:collapse; font-size:13px; margin:12px 0;">
  <tr style="background:#f3f4f6;">
    <th style="padding:8px; text-align:left; border:1px solid #e5e7eb;">Mechanism</th>
    <th style="padding:8px; text-align:left; border:1px solid #e5e7eb;">When to use</th>
    <th style="padding:8px; text-align:left; border:1px solid #e5e7eb;">Banking app example</th>
  </tr>
  <tr>
    <td style="padding:8px; border:1px solid #e5e7eb;"><code>Future</code> / async-await</td>
    <td style="padding:8px; border:1px solid #e5e7eb;"><b>I/O</b> operations (HTTP, DB, files). The thread is free while waiting for the external response.</td>
    <td style="padding:8px; border:1px solid #e5e7eb;">API calls (login, accounts, transfers), reading/writing SecureStorage, SQLite queries.</td>
  </tr>
  <tr style="background:#f9fafb;">
    <td style="padding:8px; border:1px solid #e5e7eb;"><code>Isolate.run()</code></td>
    <td style="padding:8px; border:1px solid #e5e7eb;"><b>CPU-intensive</b> work that blocks the thread (&gt;16ms). Runs in a separate thread with isolated memory.</td>
    <td style="padding:8px; border:1px solid #e5e7eb;">Parsing JSON of 10k transactions, AES encryption/decryption, generating a bank statement PDF.</td>
  </tr>
</table>

<p><b>Rule of thumb:</b> if the work is <b>waiting</b> (network, disk) &rarr; <code>async/await</code>. If the work is <b>computing</b> (CPU) &rarr; <code>Isolate</code>.</p>

<pre>// WAITING for network response - async/await
final accounts = await accountsRepository.getAll();
// The thread is free, the UI stays responsive

// COMPUTING something heavy - Isolate
final parsed = await Isolate.run(() {
  return jsonDecode(hugeJsonString) as List; // CPU-bound
});
// Without Isolate, the UI freezes during parsing</pre>

<p><b>Common mistake:</b> using <code>async/await</code> for CPU-bound work thinking it won't block. <code>await</code> only frees the thread while waiting for I/O; if the function does pure computation, the thread blocks anyway and the UI drops frames.</p>`
  },

  // ── CLEAN ARCHITECTURE ──
  {
    cat: "Clean Architecture",
    catIcon: "02",
    level: "mid",
    q: "What is Clean Architecture and what are its layers? How would you apply it in a Flutter project?",
    a: `<p>Clean Architecture separates code into concentric layers with the dependency rule: inner layers don't know about outer layers.</p>
<p>In Flutter, each feature typically has 3 layers:</p>
<ul>
  <li><b>Presentation:</b> Pages, BLoCs, widgets. Depends on domain.</li>
  <li><b>Domain:</b> Entities, Repository contracts (abstract), UseCases. Pure layer, no external dependencies.</li>
  <li><b>Data:</b> Models (DTOs), DataSources (abstract), Repository implementations. Depends on domain.</li>
</ul>
<pre>presentation/ &rarr; domain/ &larr; data/</pre>
<p>Domain is the center: presentation and data depend on domain, NEVER the other way around.</p>`
  },
  {
    cat: "Clean Architecture",
    level: "mid",
    q: "What is the difference between an Entity and a Model (DTO)? Where does the conversion happen?",
    a: `<ul>
  <li><b>Entity:</b> pure domain object, no serialization logic. Lives in <code>domain/entities/</code>.</li>
  <li><b>Model (DTO):</b> data representation with <code>fromJson()</code> and <code>toEntity()</code>. Lives in <code>data/models/</code>.</li>
</ul>
<p>The conversion happens <b>in the repository</b> (data layer), NEVER in the UI:</p>
<pre>// In repository impl
final model = AuthTokenModel.fromJson(response.data);
return Right(model.toEntity());</pre>`
  },
  {
    cat: "Clean Architecture",
    level: "mid",
    q: "What is a UseCase and why is it used? Show the typical signature.",
    a: `<p>A UseCase encapsulates a single business rule. It makes code testable and decoupled from the framework.</p>
<pre>class GetAccountDetailUseCase
    extends UseCase&lt;AccountDetail, AccountDetailParams&gt; {
  final AccountRepository repository;

  GetAccountDetailUseCase(this.repository);

  @override
  Future&lt;Either&lt;Failure, AccountDetail&gt;&gt; call(
    AccountDetailParams params,
  ) {
    return repository.getAccountDetail(params.accountId);
  }
}</pre>

// ──────────────────────────────────────────
//  RENDER
// ──────────────────────────────────────────
let activeFilter = 'all';

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';

  const grouped = {};
  let globalIdx = 0;
  questions.forEach((q, i) => {
    q._idx = i;
    q._num = ++globalIdx;
    if (!grouped[q.cat]) grouped[q.cat] = { icon: q.catIcon || '', items: [] };
    grouped[q.cat].items.push(q);
  });

  for (const [cat, data] of Object.entries(grouped)) {
    const filtered = data.items.filter(q => activeFilter === 'all' || q.level === activeFilter);
    if (filtered.length === 0) continue;

    const section = document.createElement('div');
    section.className = 'category';
    section.innerHTML = `<div class="category-title"><span class="cat-icon">${data.icon}</span>${cat}</div>`;

    filtered.forEach(q => {
      const card = document.createElement('div');
      card.className = `question-card level-${q.level}`;
      card.id = `q-${q._idx}`;
      card.innerHTML = `
        <div class="q-header" onclick="toggleCard(${q._idx})">
          <div class="q-number">${q._num}</div>
          <div class="q-meta">
            <div class="q-badges">
              <span class="badge badge-${q.level}">${q.level}</span>
            </div>
            <div class="q-text">${q.q}</div>
          </div>
          <div class="q-toggle">&#9662;</div>
        </div>
        <div class="q-body">
          <div class="answer-section">
            <h4>Expected answer</h4>
            ${q.a}
          </div>
          <div class="eval-section">
            <label>Score</label>
            <div>
              <div class="rating-group">
                ${[1,2,3,4,5].map(n => `<button class="rating-btn" onclick="rate(${q._idx}, ${n})" id="rate-${q._idx}-${n}">${n}</button>`).join('')}
              </div>
              <div class="rating-label"><span>Insufficient</span><span>Excellent</span></div>
            </div>
            <label>Notes</label>
            <textarea class="notes-input" id="notes-${q._idx}" placeholder="Notes about the candidate's answer..." oninput="saveNotes(${q._idx})"></textarea>
          </div>
        </div>
      `;
      section.appendChild(card);
    });

    container.appendChild(section);
  }

  // Restore saved data
  restoreData();
}

// ──────────────────────────────────────────
//  INTERACTIONS
// ──────────────────────────────────────────
const ratings = {};
const notes = {};

function toggleCard(idx) {
  const card = document.getElementById(`q-${idx}`);
  card.classList.toggle('open');
}

function rate(idx, value) {
  ratings[idx] = value;
  for (let i = 1; i <= 5; i++) {
    const btn = document.getElementById(`rate-${idx}-${i}`);
    btn.className = 'rating-btn' + (i === value ? ` selected-${i}` : '');
  }
  updateSummary();
  saveToStorage();
}

function saveNotes(idx) {
  const el = document.getElementById(`notes-${idx}`);
  if (el) {
    notes[idx] = el.value;
    saveToStorage();
  }
}

function filterQuestions(level) {
  activeFilter = level;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.trim().toLowerCase() === level || (level === 'all' && btn.textContent.trim() === 'All'));
  });
  renderQuestions();
}

function expandAll() {
  document.querySelectorAll('.question-card').forEach(c => c.classList.add('open'));
}

function collapseAll() {
  document.querySelectorAll('.question-card').forEach(c => c.classList.remove('open'));
}

function updateSummary() {
  const allRatings = Object.entries(ratings);
  const midRatings = allRatings.filter(([idx]) => questions[idx].level === 'mid');
  const seniorRatings = allRatings.filter(([idx]) => questions[idx].level === 'senior');

  const avg = arr => arr.length ? (arr.reduce((s, [,v]) => s + v, 0) / arr.length).toFixed(1) : '-';

  document.getElementById('avgScore').textContent = avg(allRatings);
  document.getElementById('avgMid').textContent = avg(midRatings);
  document.getElementById('avgSenior').textContent = avg(seniorRatings);
  document.getElementById('answeredCount').textContent = allRatings.length + '/' + questions.length;
}

// ──────────────────────────────────────────
//  PERSISTENCE (localStorage)
// ──────────────────────────────────────────
function saveToStorage() {
  const data = {
    candidate: document.getElementById('candidateName').value,
    position: document.getElementById('positionLevel').value,
    date: document.getElementById('interviewDate').value,
    interviewer: document.getElementById('interviewerName').value,
    ratings,
    notes,
    generalNotes: document.getElementById('generalNotes').value,
  };
  localStorage.setItem('flutter_interview_en', JSON.stringify(data));
}

function restoreData() {
  const raw = localStorage.getItem('flutter_interview_en');
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    document.getElementById('candidateName').value = data.candidate || '';
    document.getElementById('positionLevel').value = data.position || 'mid';
    document.getElementById('interviewDate').value = data.date || '';
    document.getElementById('interviewerName').value = data.interviewer || '';
    document.getElementById('generalNotes').value = data.generalNotes || '';

    if (data.ratings) {
      Object.entries(data.ratings).forEach(([idx, val]) => {
        ratings[idx] = val;
        for (let i = 1; i <= 5; i++) {
          const btn = document.getElementById(`rate-${idx}-${i}`);
          if (btn) btn.className = 'rating-btn' + (i === val ? ` selected-${i}` : '');
        }
      });
    }
    if (data.notes) {
      Object.entries(data.notes).forEach(([idx, val]) => {
        notes[idx] = val;
        const el = document.getElementById(`notes-${idx}`);
        if (el) el.value = val;
      });
    }
    updateSummary();
  } catch(e) {}
}

function resetAll() {
  if (!confirm('Are you sure you want to clear the entire evaluation?')) return;
  localStorage.removeItem('flutter_interview_en');
  Object.keys(ratings).forEach(k => delete ratings[k]);
  Object.keys(notes).forEach(k => delete notes[k]);
  document.getElementById('candidateName').value = '';
  document.getElementById('positionLevel').value = 'mid';
  document.getElementById('interviewDate').value = '';
  document.getElementById('interviewerName').value = '';
  document.getElementById('generalNotes').value = '';
  renderQuestions();
}

function exportJSON() {
  const data = {
    candidate: document.getElementById('candidateName').value,
    position: document.getElementById('positionLevel').value,
    date: document.getElementById('interviewDate').value,
    interviewer: document.getElementById('interviewerName').value,
    generalNotes: document.getElementById('generalNotes').value,
    questions: questions.map((q, i) => ({
      number: q._num,
      category: q.cat,
      level: q.level,
      question: q.q,
      rating: ratings[i] || null,
      notes: notes[i] || '',
    })),
    summary: {
      average: document.getElementById('avgScore').textContent,
      averageMid: document.getElementById('avgMid').textContent,
      averageSenior: document.getElementById('avgSenior').textContent,
      answeredCount: Object.keys(ratings).length,
      totalQuestions: questions.length,
    }
  };

  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `interview_${data.candidate.replace(/\s+/g, '_') || 'candidate'}_${data.date || 'no_date'}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// Auto-save header fields
['candidateName', 'positionLevel', 'interviewDate', 'interviewerName', 'generalNotes'].forEach(id => {
  document.getElementById(id).addEventListener('input', saveToStorage);
  document.getElementById(id).addEventListener('change', saveToStorage);
});

// Set today's date
document.getElementById('interviewDate').value = new Date().toISOString().split('T')[0];

// Initial render
renderQuestions();
</script>
